<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEFY STORE - ร้านค้าออนไลน์ & ระบบรีวิว (Dark Theme)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            950: '#050505',
                            900: '#0c0c0e',
                            800: '#141417',
                            700: '#1e1e24',
                            600: '#2a2a33',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #050505;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        /* Animated Background Canvas for Smoke/Fog & Continuous Snow */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Black Aura Effect */
        .black-aura {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 100px rgba(20, 20, 20, 0.8);
        }
        
        .white-glow {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .white-glow-hover:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Aspect ratio 16:9 banner wrapper */
        .aspect-banner {
            aspect-ratio: 16 / 9;
        }

        /* Glassmorphic dark card styling */
        .glass-card {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>

    <canvas id="bgCanvas"></canvas>
